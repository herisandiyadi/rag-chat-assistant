<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAG Chat Assistant</title>
<style>
:root {
  --bg: #0f1115; --surface: #1a1d24; --border: #2a2d35;
  --text: #e4e6eb; --text-muted: #9ca3af;
  --accent: #3b82f6; --accent-hover: #2563eb;
  --amber: #f59e0b; --green: #10b981;
}
[data-theme="light"] {
  --bg: #f8fafc; --surface: #ffffff; --border: #e2e8f0;
  --text: #1e293b; --text-muted: #64748b;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:system-ui,sans-serif; background:var(--bg); color:var(--text); height:100vh; display:flex; flex-direction:column; }
header { background:var(--surface); border-bottom:1px solid var(--border); padding:12px 20px; display:flex; justify-content:space-between; align-items:center; }
h1 { font-size:18px; }
.theme-btn { background:none; border:1px solid var(--border); color:var(--text); padding:6px 12px; border-radius:6px; cursor:pointer; }
#chat { flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:12px; }
.msg { max-width:70%; padding:12px 16px; border-radius:12px; }
.msg.user { background:var(--accent); color:white; align-self:flex-end; }
.msg.assistant { background:var(--surface); border:1px solid var(--border); align-self:flex-start; }
.msg.access-denied { background:rgba(245,158,11,0.15); border:1px solid var(--amber); align-self:flex-start; }
.msg.not-found { background:var(--surface); border:1px solid var(--border); align-self:flex-start; opacity:0.7; }
.sources { margin-top:8px; font-size:12px; color:var(--text-muted); font-family:monospace; }
#status { text-align:center; padding:8px; color:var(--text-muted); font-size:14px; }
#input-area { background:var(--surface); border-top:1px solid var(--border); padding:12px 20px; display:flex; gap:8px; }
#msg-input { flex:1; padding:10px 14px; border-radius:8px; border:1px solid var(--border); background:var(--bg); color:var(--text); }
#send-btn { padding:10px 20px; border:none; border-radius:8px; background:var(--accent); color:white; cursor:pointer; }
#send-btn:hover { background:var(--accent-hover); }
#send-btn:disabled { opacity:0.5; cursor:not-allowed; }
#login-screen { display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; gap:16px; }
#login-screen input { padding:10px 14px; border-radius:8px; border:1px solid var(--border); background:var(--surface); color:var(--text); width:300px; }
#login-screen button { padding:10px 20px; border:none; border-radius:8px; background:var(--accent); color:white; cursor:pointer; width:300px; }
.error { color:var(--amber); font-size:14px; }
#typing { display:none; }
</style>
</head>
<body data-theme="dark">
<div id="login-screen">
  <h1>🔐 RAG Chat Assistant</h1>
  <input id="login-username" placeholder="Username" autocomplete="username">
  <input id="login-password" type="password" placeholder="Password" autocomplete="current-password">
  <button id="login-btn">Masuk</button>
  <p id="login-error" class="error"></p>
</div>
<div id="chat-app" style="display:none; flex-direction:column; height:100vh;">
<header>
  <h1>💬 RAG Chat Assistant</h1>
  <button id="theme-btn" class="theme-btn">☀️ Terang</button>
</header>
<div id="chat"></div>
<div id="status"></div>
<div id="input-area">
  <input id="msg-input" placeholder="Tulis pertanyaan..." autocomplete="off">
  <button id="send-btn">Kirim</button>
</div>
</div>
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<script>
const API = location.origin;
let socket = null;
let token = localStorage.getItem('rag_token') || '';

// Login
document.getElementById('login-btn').onclick = async () => {
  const u = document.getElementById('login-username').value;
  const p = document.getElementById('login-password').value;
  const err = document.getElementById('login-error');
  err.textContent = '';
  try {
    const r = await fetch(API + '/auth/login', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({username: u, password: p})
    });
    if (!r.ok) throw new Error('login');
    const d = await r.json();
    token = d.access_token;
    localStorage.setItem('rag_token', token);
    showChat();
  } catch (e) { err.textContent = 'Username atau password salah.'; }
};

function showChat() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('chat-app').style.display = 'flex';
  connectSocket();
}

function connectSocket() {
  socket = io(API, {transports: ['websocket']});
  socket.on('connect', () => socket.emit('auth', {token}));
  socket.on('status', (d) => document.getElementById('status').textContent = d.tahap);
  socket.on('chat:token', (d) => appendMsg('assistant', d.token));
  socket.on('chat:sources', (d) => {
    const src = d.dokumen.map(x => `${x.judul} (v${x.versi})`).join(', ');
    const el = document.querySelector('.msg.assistant:last-child .sources');
    if (el) el.textContent = 'Sumber: ' + src;
  });
  socket.on('chat:done', () => {
    document.getElementById('status').textContent = '';
    document.getElementById('send-btn').disabled = false;
  });
  socket.on('error', (d) => {
    appendMsg('assistant', d.pesan, 'not-found');
    document.getElementById('send-btn').disabled = false;
  });
  socket.on('connect_error', () => {
    document.getElementById('status').textContent = 'Koneksi terputus — menyambung kembali...';
  });
}

function appendMsg(role, text, cls) {
  const chat = document.getElementById('chat');
  const div = document.createElement('div');
  div.className = 'msg ' + (cls || role);
  div.textContent = text;
  if (role === 'assistant' && !cls) {
    const s = document.createElement('div');
    s.className = 'sources';
    div.appendChild(s);
  }
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

// Send
const send = () => {
  const input = document.getElementById('msg-input');
  const text = input.value.trim();
  if (!text || !socket) return;
  appendMsg('user', text);
  input.value = '';
  document.getElementById('send-btn').disabled = true;
  socket.emit('chat:text', {pertanyaan: text});
};
document.getElementById('send-btn').onclick = send;
document.getElementById('msg-input').addEventListener('keydown', (e) => { if (e.key === 'Enter') send(); });

// Theme
document.getElementById('theme-btn').onclick = () => {
  const body = document.body;
  const dark = body.getAttribute('data-theme') === 'dark';
  body.setAttribute('data-theme', dark ? 'light' : 'dark');
  document.getElementById('theme-btn').textContent = dark ? '🌙 Gelap' : '☀️ Terang';
};

// Auto-login jika ada token
if (token) showChat();
</script>
</body>
</html>
