# PostgreSQL (rag_postgres, port 5432) dan Qdrant (rag_qdrant, port 6333)
# sudah berjalan sebagai container terpisah di host ini.
# App memakai host network supaya langsung menjangkau keduanya lewat
# localhost tanpa duplikasi service dan konflik port.
# Bila deploy fresh di VPS baru: tambahkan kembali service postgres & qdrant.
services:
  fastapi-app:
    build:
      context: .
      dockerfile: Dockerfile.app
    container_name: rag_fastapi
    network_mode: host
    env_file: .env
    restart: unless-stopped