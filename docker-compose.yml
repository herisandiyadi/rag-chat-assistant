version: '3.8'

services:
  postgres:
    image: postgres:14
    container_name: rag_chat_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ragchat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ragchat123}
      POSTGRES_DB: ${POSTGRES_DB:-rag_chat_db}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.8.0
    container_name: rag_chat_qdrant
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"
    restart: unless-stopped

  fastapi-app:
    build: .
    container_name: rag_chat_fastapi
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-ragchat}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-ragchat123}
      - POSTGRES_DB=${POSTGRES_DB:-rag_chat_db}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY:-}
      - JWT_SECRET=${JWT_SECRET:-changeme}
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - qdrant
    restart: unless-stopped

volumes:
  pg_data:
  qdrant_data:
